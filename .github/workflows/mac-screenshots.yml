# Captures the Mac App Store screenshots from the real Mac app (MushafMac/Screenshots/capture.sh) and pushes them
# to the mac-screenshots branch (ios-assets/appstore-assets/mac/), to be merged from there.
name: Mac screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Build the app
        working-directory: MushafMac
        run: ./make-app.sh
      - name: Screen
        run: system_profiler SPDisplaysDataType | grep -i resolution || true
      - name: Capture
        run: MushafMac/Screenshots/capture.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screenshots
          path: ios-assets/appstore-assets/mac/
      - name: Push to the mac-screenshots branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b mac-screenshots
          git add ios-assets/appstore-assets/mac
          git commit -m "Mac App Store screenshots"
          git push -f origin mac-screenshots
