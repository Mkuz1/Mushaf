# Fills Mus'haf's App Store listing in App Store Connect (texts in Arabic, English and French, categories, age
# rating, free price, the version and its build, screenshots for every device, App Review notes), from
# ios-assets/appstore-metadata/listing.json and ios-assets/appstore-assets/. See ios-assets/appstore_listing.py.
# Uses the same API key secrets as the App Store workflow. Safe to run again: it updates what is there.
name: App Store listing

on:
  workflow_dispatch:
    inputs:
      platform:
        description: IOS (iPhone and iPad), MAC_OS or TV_OS (Apple TV)
        type: choice
        options: [IOS, MAC_OS, TV_OS]
        default: IOS
      copyright:
        description: Copyright line, e.g. "2026 Your Name" (empty to leave it as is)
        required: false
      contact_name:
        description: App Review contact, first and last name (masked in the logs)
        required: false
      contact_email:
        description: App Review contact email (masked in the logs)
        required: false
      contact_phone:
        description: App Review contact phone, with + and the country code (masked in the logs)
        required: false
      video_url:
        description: Link to the screen recording for App Review (goes in the review notes)
        required: false
      submit:
        description: Also submit the version to App Review
        type: boolean
        default: false
      withdraw:
        description: First take the version back from App Review (to replace its build or texts)
        type: boolean
        default: false
      submit_only:
        description: Only (re)submit to App Review, changing nothing else
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - name: Mask the contact details
        # This repository's run logs are public: the contact details are read from the event file (a step's env
        # and script are printed in its log) and masked before anything could print them.
        run: |
          for k in contact_name contact_email contact_phone; do
            v=$(jq -r ".inputs.$k // empty" "$GITHUB_EVENT_PATH")
            for p in "$v" $v; do [ -n "$p" ] && echo "::add-mask::$p"; done
          done; true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyjwt cryptography requests
      - name: Fill the listing
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY: ${{ secrets.APPSTORE_KEY }}
          COPYRIGHT: ${{ inputs.copyright }}
        run: |
          name=$(jq -r '.inputs.contact_name // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$name" ]; then
            export REVIEW_FIRST_NAME="${name%% *}" REVIEW_LAST_NAME="${name#* }"
          fi
          export REVIEW_EMAIL=$(jq -r '.inputs.contact_email // empty' "$GITHUB_EVENT_PATH")
          export REVIEW_VIDEO=$(jq -r '.inputs.video_url // empty' "$GITHUB_EVENT_PATH")
          export REVIEW_PHONE=$(jq -r '.inputs.contact_phone // empty' "$GITHUB_EVENT_PATH")
          args=(--platform "${{ inputs.platform || 'IOS' }}")
          [ -n "$COPYRIGHT" ] && args+=(--copyright "$COPYRIGHT")
          [ "${{ inputs.submit }}" = "true" ] && args+=(--submit)
          [ "${{ inputs.submit_only }}" = "true" ] && args+=(--submit-only)
          [ "${{ inputs.withdraw }}" = "true" ] && args+=(--withdraw)
          python ios-assets/appstore_listing.py "${args[@]}"
