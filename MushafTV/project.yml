# Mus'haf for Apple TV: the tvOS app (Sources/) with the Mac app's shared data, audio and translation code.
# Generated by make-project.sh (XcodeGen); built and uploaded by .github/workflows/appstore-tv.yml.
name: MushafTV
options:
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    MARKETING_VERSION: ${MUSHAF_VERSION}
    CURRENT_PROJECT_VERSION: ${MUSHAF_BUILD}
targets:
  MushafTV:
    type: application
    platform: tvOS
    scheme: {}
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: ../MushafMac/Sources/MushafMac/Storage.swift
      - path: ../MushafMac/Sources/MushafMac/GlyphDB.swift
      - path: ../MushafMac/Sources/MushafMac/AudioController.swift
      - path: ../MushafMac/Sources/MushafMac/Localization.swift
      - path: ../MushafMac/Sources/MushafMac/TextLibrary.swift
    dependencies:
      - sdk: libsqlite3.tbd
    info:
      path: Info.plist
      properties:
        CFBundleName: Mus'haf
        CFBundleDisplayName: Mus'haf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_NAME: Mushaf
        PRODUCT_BUNDLE_IDENTIFIER: com.kousa.mushaf
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: LaunchImage
        CODE_SIGN_STYLE: Automatic
