# The Mac App Store build of Mus'haf: the same sources as the DMG (../Sources), as an Xcode project so Xcode
# signs it automatically with the App Store Connect API key. Generated by make-project.sh (XcodeGen); used by
# .github/workflows/appstore-mac.yml.
name: Mushaf
options:
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    MARKETING_VERSION: ${MUSHAF_VERSION}
    CURRENT_PROJECT_VERSION: ${MUSHAF_BUILD}
targets:
  Mushaf:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: ../Sources/MushafMac
      - path: AppIcon.xcassets
      - path: ../Assets/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: libsqlite3.tbd
    entitlements:
      path: Mushaf.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    info:
      path: Info.plist
      properties:
        CFBundleName: Mus'haf
        CFBundleDisplayName: Mus'haf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ATSApplicationFontsPath: Fonts
        LSApplicationCategoryType: public.app-category.reference
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: Free, as a Sadaqa Jariyah.
        CFBundleURLTypes:
          - CFBundleURLName: com.kousa.mushaf
            CFBundleURLSchemes: [mushaf]
    settings:
      base:
        PRODUCT_NAME: Mushaf
        PRODUCT_BUNDLE_IDENTIFIER: com.kousa.mushaf
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
